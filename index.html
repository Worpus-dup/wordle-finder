<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Finder</title>
    <link data-trunk rel="css" href="static/style.css" />
    <link data-trunk rel="rust" />
</head>
<body>
    <main>
        <section id="inputs">
            <h1>Wordle Finder</h1>

            <fieldset id="correct-letters">
                <legend>Correct Letters</legend>
                <div class="word-row">
                    <input maxlength="1" type="text" placeholder=" " aria-label="Position 1">
                    <input maxlength="1" type="text" placeholder=" " aria-label="Position 2">
                    <input maxlength="1" type="text" placeholder=" " aria-label="Position 3">
                    <input maxlength="1" type="text" placeholder=" " aria-label="Position 4">
                    <input maxlength="1" type="text" placeholder=" " aria-label="Position 5">
                </div>
            </fieldset>

            <fieldset id="misplaced-letters">
                <legend>Misplaced Letters</legend>
                <div id="misplaced-rows">
                    <div class="word-row">
                        <input maxlength="1" type="text" placeholder=" " aria-label="Position 1">
                        <input maxlength="1" type="text" placeholder=" " aria-label="Position 2">
                        <input maxlength="1" type="text" placeholder=" " aria-label="Position 3">
                        <input maxlength="1" type="text" placeholder=" " aria-label="Position 4">
                        <input maxlength="1" type="text" placeholder=" " aria-label="Position 5">
                        <button type="button" class="remove-row" aria-label="Remove row">&times;</button>
                    </div>
                </div>
                <button type="button" id="add-row">+ Add Row</button>
            </fieldset>

            <fieldset id="excluded-letters">
                <legend>Excluded Letters</legend>
                <input type="text" placeholder="e.g., xyz" aria-label="Excluded letters">
            </fieldset>

            <button type="button" id="clear-all">Clear All</button>
        </section>

        <section id="outputs">
            <h2>Possible Words</h2>
            <div id="error" hidden></div>
            <div id="results"></div>
        </section>
    </main>
    <footer>
        <p>Designed by Eugene Turov and coded by Big Pickle&trade;</p>
        <p>&copy; 2026 Eugene Turov &lt;geny0turov@gmail.com&gt;</p>
    </footer>
</body>
</html>
